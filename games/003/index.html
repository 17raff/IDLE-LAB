<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ランダム五目 | IDLE-LAB</title><style>
:root{--bg:#101110;--panel:#1c211b;--line:#455143;--lime:#c6f36b;--blue:#61b2ff;--red:#ff6b70;--text:#f1f3ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;min-height:100dvh}button{font:inherit;cursor:pointer}main{max-width:600px;margin:auto;padding:14px 14px 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:11px;color:var(--lime);letter-spacing:.1em}h1{font-size:23px;margin:3px 0 0}.pill{background:var(--panel);border:1px solid #384335;border-radius:12px;padding:9px 12px;font-size:13px;min-width:112px;text-align:right}.b{color:var(--blue)}.r{color:var(--red)}.status{display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px;gap:8px}.status strong{font-size:14px}.muted{color:#a8b3a4;font-size:12px}.board{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(12,minmax(0,1fr));width:100%;gap:2px;background:#344032;padding:5px;border-radius:12px;aspect-ratio:1 / 1;overflow:hidden;touch-action:manipulation}.cell{position:relative;display:grid;place-items:center;border:0;border-radius:3px;background:#202820;padding:0;min-width:0;min-height:0;overflow:hidden;aspect-ratio:1 / 1}.cell:disabled{cursor:default}.cell:not(:disabled):active{background:#384535}.mark{width:70%;height:70%;display:block;box-sizing:border-box;flex:none}.mark.o{border:clamp(2px,.7vw,4px) solid var(--blue);border-radius:50%}.mark.x{position:relative}.mark.x:before,.mark.x:after{content:"";position:absolute;left:46%;top:2%;width:clamp(2px,.7vw,4px);height:96%;background:var(--red);border-radius:5px;transform:rotate(45deg)}.mark.x:after{transform:rotate(-45deg)}.cell.win{background:#536f38;box-shadow:inset 0 0 0 2px var(--lime)}.actions{display:flex;gap:10px;margin-top:14px}.btn{border:0;border-radius:12px;background:var(--lime);color:#17210e;font-weight:800;padding:14px 18px;flex:1}.btn.secondary{background:#303a2d;color:var(--text)}a.btn{display:block;text-decoration:none;text-align:center}.note{text-align:center;font-size:12px;color:#9ca99a;margin:12px 0}.overlay{position:fixed;inset:0;background:#080b08d9;display:grid;place-items:center;padding:18px;z-index:10}.dialog{width:min(100%,440px);background:#1d241c;border:1px solid #495744;border-radius:20px;padding:24px;box-shadow:0 18px 65px #0009}.dialog h2{margin:0 0 12px;font-size:25px}.dialog p{line-height:1.8;color:#c9d1c5;font-size:14px}.choice{display:flex;gap:10px;margin:16px 0}.choice button{flex:1;background:#303b2d;border:2px solid transparent;color:#eef4e7;border-radius:12px;padding:13px 6px;font-weight:700}.choice button.selected{border-color:var(--lime);background:#3d4d30}.notice-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}.notice-actions .btn{width:100%}.hide{display:none!important}.turnhint{font-size:12px;color:#b6c1af;margin-top:10px}.turn-symbol{font-weight:900;font-size:17px}.turn-symbol.o{color:var(--blue)}.turn-symbol.x{color:var(--red)}.big-symbol{font-size:42px;font-weight:900}.footer{margin-top:20px;color:#7d8b78;font-size:11px;text-align:center}@media(max-width:370px){main{padding:10px 8px}.board{gap:1px;padding:4px}.pill{font-size:12px;padding:8px}.status strong{font-size:12px}}
</style></head><body><main><header class="top"><div><div class="brand">IDLE-LAB / GAME 003</div><h1>ランダム五目</h1></div><div class="pill" id="queue">今：—<br>次：—</div></header><div class="status"><strong id="who">5つ並べて勝利！</strong><span class="muted" id="moveCount">0 / 144 マス</span></div><div class="board" id="board" aria-label="12×12の盤面"></div><div class="actions"><button class="btn secondary" id="rulesBtn">ルール</button><a class="btn secondary" id="restartBtn" href="https://17raff.github.io/IDLE-LAB/">ゲーム広場へ</a></div><p class="note">縦・横・斜めのどれかで5つつなげよう！</p><div class="footer">ひまゲー開発委員会 · IDLE-LAB</div></main>
<div class="overlay" id="startOverlay"><div class="dialog"><div class="brand">IDLE-LAB / GAME 003</div><h2>ランダム五目</h2><p>1台のスマホで2人対戦！<br>青の <span class="b">〇</span> と赤の <span class="r">×</span> を交互…とは限らず置いていき、<b>縦・横・斜めに5つ</b>並べたら勝ち！<br><b>同じ人の2連続ターンはあり。3連続は絶対になし。</b></p><div style="font-weight:700;font-size:14px">何ターン先まで見える？</div><div class="choice"><button class="selected" data-look="1">1ターン先</button><button data-look="3">3ターン先</button></div><button class="btn" id="startBtn" style="width:100%">ゲーム開始！</button><a class="btn secondary" id="startHomeBtn" href="https://17raff.github.io/IDLE-LAB/" style="width:100%;margin-top:10px">ゲーム広場に戻る</a></div></div>
<div class="overlay hide" id="noticeOverlay"><div class="dialog" style="text-align:center"><div class="brand" id="noticeLabel">先攻決定</div><div class="big-symbol" id="noticeSymbol">〇</div><h2 id="noticeTitle">青の先攻！</h2><p id="noticeText">スマホを渡して始めよう！</p><div class="notice-actions"><button class="btn" id="noticeBtn">OK！</button><a class="btn secondary hide" id="titleBtn" href="https://17raff.github.io/IDLE-LAB/">ゲーム広場に戻る</a></div></div></div>
<script>
(()=>{'use strict';
const SIZE=12,MAX=SIZE*SIZE,DIRS=[[1,0],[0,1],[1,1],[1,-1]];
const $=id=>document.getElementById(id);const boardEl=$('board');let board=[],sequence=[],turnIndex=0,lookahead=1,playing=false,finished=false,winCells=[],noticeAction=null;
const rand=()=>Math.random()<.5?'o':'x';const other=s=>s==='o'?'x':'o';const name=s=>s==='o'?'青の〇':'赤の×';const symbol=s=>s==='o'?'〇':'×';
function ensureTurns(n){while(sequence.length<=n){let len=sequence.length;if(len>=2&&sequence[len-1]===sequence[len-2])sequence.push(other(sequence[len-1]));else sequence.push(rand());}}
function start(){board=Array(MAX).fill(null);sequence=[rand()];turnIndex=0;finished=false;playing=false;winCells=[];ensureTurns(lookahead);render();$('startOverlay').classList.add('hide');showNotice('先攻決定',sequence[0],`${name(sequence[0])}が先攻！`,'スマホを渡して始めよう！',()=>{playing=true;render();});}
function showNotice(label,side,title,msg,action){$('noticeLabel').textContent=label;$('noticeSymbol').textContent=symbol(side);$('noticeSymbol').style.color=side==='o'?'var(--blue)':'var(--red)';$('noticeTitle').textContent=title;$('noticeText').textContent=msg;$('noticeBtn').textContent=label==='ゲーム終了'?'もう一度遊ぶ':'OK！';$('titleBtn').classList.toggle('hide',label!=='ゲーム終了');noticeAction=action;$('noticeOverlay').classList.remove('hide');}
function checkWin(index,side){let x=index%SIZE,y=Math.floor(index/SIZE);for(let [dx,dy] of DIRS){let line=[[x,y]];for(let sign of [-1,1]){for(let k=1;k<5;k++){let xx=x+dx*k*sign,yy=y+dy*k*sign;if(xx<0||xx>=SIZE||yy<0||yy>=SIZE||board[yy*SIZE+xx]!==side)break;line.push([xx,yy]);}}if(line.length>=5)return line.map(([a,b])=>b*SIZE+a);}return null;}
function place(i){if(!playing||finished||board[i])return;const side=sequence[turnIndex];board[i]=side;let won=checkWin(i,side);if(won){winCells=won;finished=true;playing=false;render();showNotice('ゲーム終了',side,`${name(side)}の勝利！`,'5つつながった！おめでとう！',start);return;}if(board.every(Boolean)){finished=true;playing=false;render();showNotice('ゲーム終了',side,'引き分け！','盤面がすべて埋まりました。',start);return;}turnIndex++;ensureTurns(turnIndex+lookahead);render();}
function render(){boardEl.replaceChildren();for(let i=0;i<MAX;i++){const cell=document.createElement('button');cell.className='cell'+(winCells.includes(i)?' win':'');cell.type='button';cell.setAttribute('aria-label',`${Math.floor(i/SIZE)+1}行${i%SIZE+1}列${board[i]?' '+name(board[i]):' 空き'}`);cell.disabled=!playing||finished||!!board[i];if(board[i]){const mark=document.createElement('span');mark.className='mark '+board[i];cell.append(mark);}cell.addEventListener('click',()=>place(i));boardEl.append(cell);}const n=board.filter(Boolean).length;$('moveCount').textContent=`${n} / ${MAX} マス`;if(!sequence.length){$('who').textContent='5つ並べて勝利！';$('queue').innerHTML='今：—<br>次：—';return;}const cur=sequence[turnIndex];$('who').innerHTML=`<span class="${cur==='o'?'b':'r'}">${name(cur)}</span> のターン`;$('queue').innerHTML=`今：<span class="turn-symbol ${cur}">${symbol(cur)}</span><br>次：${sequence.slice(turnIndex+1,turnIndex+lookahead+1).map(s=>`<span class="turn-symbol ${s}">${symbol(s)}</span>`).join(' ')}`;}
for(let b of document.querySelectorAll('[data-look]'))b.addEventListener('click',()=>{lookahead=Number(b.dataset.look);document.querySelectorAll('[data-look]').forEach(x=>x.classList.toggle('selected',x===b));});$('startBtn').addEventListener('click',start);$('noticeBtn').addEventListener('click',()=>{$('noticeOverlay').classList.add('hide');if(noticeAction){const fn=noticeAction;noticeAction=null;fn();}});const HOME_URL='https://17raff.github.io/IDLE-LAB/';



$('rulesBtn').addEventListener('click',()=>{playing=false;showNotice('ルール説明','o','5つ並べたら勝ち！','縦・横・斜めに同じ記号を5個並べよう。ターンはランダム。最大2連続で、次の1または3ターンを先読みできます。',()=>{if(sequence.length&&!finished)playing=true;render();});});
})();
</script></body></html>
