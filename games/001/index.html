
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>枝豆飛ばし | IDLE-LAB</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#171513;font-family:system-ui,sans-serif;color:#f4f0e7}
canvas{display:block;touch-action:none}
#app{position:fixed;inset:0}
#ui{pointer-events:none;position:fixed;inset:0}
header{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 19px) 21px;background:linear-gradient(#16130fc9,transparent);font-size:12px;letter-spacing:2px;font-weight:800}
.muted{opacity:.6}
#count{font-size:19px;letter-spacing:5px;color:#c6f36b}
#scoreline{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 25px);width:100%;text-align:center;font-size:13px;letter-spacing:2px;text-shadow:0 2px 8px #000}
#screen{position:fixed;inset:0;background:#131411dd;display:grid;place-items:center;padding:22px;z-index:3}
.panel{width:min(390px,100%);background:#22231e;border:1px solid #5b634b;border-radius:22px;padding:30px;text-align:center;box-shadow:0 25px 80px #0008}
.panel h1{font-size:43px;margin:10px 0}
.panel p{font-size:13px;line-height:1.9;color:#c3c7b9}
.panel button{width:100%;padding:15px;margin-top:20px;border:0;border-radius:10px;background:#c6f36b;color:#18200e;font-weight:900;font-size:16px;cursor:pointer}
.panel button.alt{background:transparent;color:#f4f0e7;border:1px solid #72776b;margin-top:9px}
.hidden{display:none!important}
#resultNumber{font-size:45px;color:#c6f36b;font-weight:900}
#results{line-height:2.2;font-size:14px}
#notice{position:absolute;top:36%;width:100%;text-align:center;font-size:33px;font-weight:900;text-shadow:0 3px 15px #000;opacity:0;transition:opacity .25s}
#notice.on{opacity:1}
#load{position:fixed;inset:0;display:grid;place-items:center;background:#171513;z-index:9}
</style>
</head>
<body>
<div id="app"></div>
<div id="ui">
<header>
<div>IDLE-LAB <span class="muted">/ 001</span></div>
<div id="count">● ● ●</div>
</header>
<div id="notice"></div>
<div id="scoreline"></div>
</div>
<div id="screen">
<div class="panel" id="intro">
<div style="letter-spacing:4px;color:#c6f36b;font-size:12px">GAME 001</div>
<h1>枝豆飛ばし</h1>
<p>3粒の枝豆を、遠くの小さなお茶碗へ。<br>1本指で狙い、2本指でつまんで飛ばす。</p>
<button id="start">START</button>
</div>
<div class="panel hidden" id="end">
<div style="letter-spacing:4px;color:#c6f36b;font-size:12px">RESULT</div>
<h1>枝豆飛ばし</h1>
<div id="resultNumber"></div>
<div id="results"></div>
<button id="again">RETRY</button>
<button class="alt" id="share">𝕏 SHARE</button>
<button class="alt" id="home">BACK TO IDLE-LAB</button>
</div>
</div>
<div id="load">🫛</div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.180.0';
import * as CANNON from 'https://esm.sh/cannon-es@0.20.0';

const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x302b27);
scene.fog=new THREE.Fog(0x302b27,7,19);

const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.01,80);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
$('app').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffead2,0x48453b,2));

const light=new THREE.DirectionalLight(0xffe2b1,3);
light.position.set(-2,5,2);
light.castShadow=true;
light.shadow.mapSize.set(1024,1024);
light.shadow.camera.left=-7;
light.shadow.camera.right=7;
light.shadow.camera.top=7;
light.shadow.camera.bottom=-7;
scene.add(light);

const world=new CANNON.World({gravity:new CANNON.Vec3(0,-9.82,0)});
world.allowSleep=true;
world.solver.iterations=14;
world.broadphase=new CANNON.SAPBroadphase(world);

const floorMat=new CANNON.Material('wood');
const beanMat=new CANNON.Material('bean');
const ceramic=new CANNON.Material('ceramic');

world.addContactMaterial(new CANNON.ContactMaterial(floorMat,beanMat,{
 friction:.53,restitution:.34
}));
world.addContactMaterial(new CANNON.ContactMaterial(ceramic,beanMat,{
 friction:.34,restitution:.35
}));

const mat=(color,roughness=.7,extra={})=>
 new THREE.MeshStandardMaterial({color,roughness,...extra});

const wood=mat(0x8a6548,.9);
const seam=mat(0x487d32,.8);
const podMat=mat(0x70a744,.72);
const podLight=mat(0x8bc657,.68);
const podDark=mat(0x507f34,.85);
const beanGreen=mat(0xa5cb6a,.6);
const cream=mat(0xe8e4d8,.35,{side:THREE.DoubleSide});
const inner=mat(0xcbd5cf,.37,{side:THREE.DoubleSide});

// 木製床
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),wood);
floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
scene.add(floor);

const groundBody=new CANNON.Body({
 mass:0,
 material:floorMat,
 shape:new CANNON.Plane()
});
groundBody.quaternion.setFromEuler(-Math.PI/2,0,0);
world.addBody(groundBody);

// 床板の継ぎ目と木目
const boardLine=new THREE.MeshBasicMaterial({
 color:0x4b3527,transparent:true,opacity:.28
});

for(let i=-15;i<=15;i++){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(.006,.001,24),boardLine
 );
 m.position.set(i*.42,.001,-5);
 scene.add(m);
}

for(let i=0;i<90;i++){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(.003,.001,.2+Math.random()*.8),
  new THREE.MeshBasicMaterial({
   color:0xb68b65,transparent:true,opacity:.07
  })
 );
 m.position.set((Math.random()-.5)*10,.002,-Math.random()*12);
 scene.add(m);
}

// 室内の壁
const wall=new THREE.Mesh(
 new THREE.PlaneGeometry(24,10),
 mat(0x70675e,.95)
);
wall.position.set(0,5,-8);
scene.add(wall);

const trim=new THREE.Mesh(
 new THREE.BoxGeometry(24,.11,.09),
 mat(0x443a32)
);
trim.position.set(0,.06,-7.95);
scene.add(trim);

// お茶碗
let bowl=null;
let bowlBodies=[];
let distance=4;

function radiusAt(y){
 return .018+.022*Math.pow(
  Math.max(0,Math.min(1,y/.04)),.82
 );
}

function buildBowl(){
 if(bowl)scene.remove(bowl);
 bowlBodies.forEach(b=>world.removeBody(b));
 bowlBodies=[];

 bowl=new THREE.Group();
 bowl.position.z=-distance;
 scene.add(bowl);

 const profile=[];
 for(let i=0;i<=24;i++){
  const y=.04*i/24;
  profile.push(new THREE.Vector2(radiusAt(y),y));
 }

 const shell=new THREE.Mesh(
  new THREE.LatheGeometry(profile,48),cream
 );
 shell.castShadow=true;
 shell.receiveShadow=true;
 bowl.add(shell);

 const inside=[];
 for(let i=0;i<=24;i++){
  const y=.005+.035*i/24;
  inside.push(new THREE.Vector2(
   Math.max(.008,radiusAt(y)-.003),y
  ));
 }

 const liner=new THREE.Mesh(
  new THREE.LatheGeometry(inside,48),inner
 );
 bowl.add(liner);

 const rim=new THREE.Mesh(
  new THREE.TorusGeometry(.039,.0024,8,48),cream
 );
 rim.rotation.x=Math.PI/2;
 rim.position.y=.04;
 bowl.add(rim);

 const foot=new THREE.Mesh(
  new THREE.CylinderGeometry(.019,.021,.004,32),cream
 );
 foot.position.y=.002;
 bowl.add(foot);

 // お茶碗の壁を分割して衝突判定を作る
 for(let k=0;k<5;k++){
  const y0=.04*k/5;
  const y1=.04*(k+1)/5;
  const rm=(radiusAt(y0)+radiusAt(y1))/2;

  for(let j=0;j<32;j++){
   const a=(j+.5)*Math.PI*2/32;

   const shape=new CANNON.Box(
    new CANNON.Vec3(
     .004,
     (y1-y0)/2+.0004,
     rm*Math.sin(Math.PI/32)+.001
    )
   );

   const body=new CANNON.Body({
    mass:0,material:ceramic
   });
   body.addShape(shape);
   body.position.set(
    rm*Math.cos(a),
    (y0+y1)/2,
    -distance+rm*Math.sin(a)
   );
   body.quaternion.setFromEuler(0,-a,0);
   world.addBody(body);
   bowlBodies.push(body);
  }
 }

 const bottom=new CANNON.Body({
  mass:0,material:ceramic
 });
 bottom.addShape(
  new CANNON.Cylinder(.018,.018,.006,24)
 );
 bottom.position.set(0,.004,-distance);
 world.addBody(bottom);
 bowlBodies.push(bottom);
}

// 枝豆のさや
const pod=new THREE.Group();
scene.add(pod);

const podVisual=new THREE.Group();
pod.add(podVisual);

let podBodyMesh;

function createPodGeometry(){
 const rings=38;
 const sides=24;
 const verts=[];
 const uv=[];
 const idx=[];

 for(let i=0;i<=rings;i++){
  const t=i/rings;
  const x=(t-.5)*.185;
  const end=Math.pow(
   Math.max(.025,Math.sin(Math.PI*t)),.65
  );

  let bumps=0;
  for(const c of [.25,.5,.75]){
   bumps+=Math.exp(
    -Math.pow((t-c)/.095,2)
   )*.0065;
  }

  const r=(.009+bumps)*end;

  for(let j=0;j<=sides;j++){
   const a=j/sides*Math.PI*2;
   const ridge=1+.065*Math.cos(a*2);

   verts.push(
    x,
    Math.sin(a)*r*1.18*ridge,
    Math.cos(a)*r*.83
   );
   uv.push(t,j/sides);

   if(i<rings&&j<sides){
    const n=i*(sides+1)+j;
    idx.push(
     n,n+sides+1,n+1,
     n+1,n+sides+1,n+sides+2
    );
   }
  }
 }

 const g=new THREE.BufferGeometry();
 g.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(verts,3)
 );
 g.setAttribute(
  'uv',
  new THREE.Float32BufferAttribute(uv,2)
 );
 g.setIndex(idx);
 g.computeVertexNormals();
 return g;
}

podBodyMesh=new THREE.Mesh(
 createPodGeometry(),podMat
);
podBodyMesh.castShadow=true;
podVisual.add(podBodyMesh);

// さやの合わせ目
for(const s of [-1,1]){
 const pts=[];

 for(let i=0;i<=44;i++){
  const t=i/44;
  const x=(t-.5)*.185;
  const r=.009*Math.pow(
   Math.max(.02,Math.sin(Math.PI*t)),.65
  );
  pts.push(new THREE.Vector3(
   x,s*r*.22,-r*.87
  ));
 }

 const curve=new THREE.CatmullRomCurve3(pts);
 const edge=new THREE.Mesh(
  new THREE.TubeGeometry(curve,64,.0015,5,false),
  s===1?podLight:podDark
 );
 podVisual.add(edge);
}

// 豆の膨らみ
const bumps=[];

for(let i=0;i<3;i++){
 const b=new THREE.Mesh(
  new THREE.SphereGeometry(.018,24,16),
  podLight
 );
 b.scale.set(1,.85,.55);
 b.position.set((i-1)*.045,0,-.004);
 podVisual.add(b);
 bumps.push(b);
}

// 茎
const stem=new THREE.Mesh(
 new THREE.CylinderGeometry(.002,.003,.02,8),
 podDark
);
stem.rotation.z=Math.PI/2;
stem.position.x=-.097;
podVisual.add(stem);

// ゲーム状態
let yaw=0;
let pitch=33;
let round=0;
let records=[];
let mode='menu';
let bean=null;
let body=null;
let shotStart=0;
let still=0;
let pinch=null;
let charge=0;

const pointers=new Map();

function updatePod(){
 pod.position.set(0,.18,.32);
 pod.rotation.order='YXZ';
 pod.rotation.y=yaw*Math.PI/180;
 pod.rotation.x=-pitch*Math.PI/180;

 bumps.forEach((b,i)=>{
  b.visible=i>=round;
 });

 podBodyMesh.scale.y=1-charge*.28;
 podBodyMesh.scale.z=1-charge*.32;

 bumps.forEach(b=>{
  b.scale.z=.55*(1-charge*.55);
 });
}

function resetShot(){
 if(bean){
  scene.remove(bean);
  bean=null;
 }
 if(body){
  world.removeBody(body);
  body=null;
 }

 mode='aim';
 charge=0;
 pinch=null;
 still=0;
 pointers.clear();

 pod.visible=true;
 updatePod();

 $('count').textContent=
  '● '.repeat(3-round)+'○ '.repeat(round);

 $('scoreline').textContent=records.length
  ?records.map(n=>`${n}cm`).join('  /  ')
  :'';

 camera.position.set(0,.42,1.12);
 camera.lookAt(0,.14,-1.1);
}

function start(){
 distance=(30+Math.floor(Math.random()*21))/10;
 round=0;
 records=[];
 yaw=0;
 pitch=33;

 buildBowl();
 $('screen').classList.add('hidden');
 resetShot();
}

function launch(strength){
 if(mode!=='aim')return;

 mode='flight';
 pod.visible=false;

 const speed=3.6+
  Math.max(.06,Math.min(1,strength))*7.6;

 bean=new THREE.Mesh(
  new THREE.SphereGeometry(.008,24,16),
  beanGreen
 );
 bean.scale.set(1.12,.9,.94);
 bean.castShadow=true;
 scene.add(bean);

 body=new CANNON.Body({
  mass:.0012,
  material:beanMat,
  shape:new CANNON.Sphere(.008),
  linearDamping:.045,
  angularDamping:.32,
  allowSleep:true,
  sleepSpeedLimit:.04,
  sleepTimeLimit:.65
 });

 body.position.set(0,.18,.2);

 const y=yaw*Math.PI/180;
 const p=pitch*Math.PI/180;

 body.velocity.set(
  Math.sin(y)*Math.cos(p)*speed,
  Math.sin(p)*speed,
  -Math.cos(y)*Math.cos(p)*speed
 );

 body.angularVelocity.set(5,8,3);
 world.addBody(body);

 shotStart=performance.now();
 still=0;
}

function notice(t){
 $('notice').textContent=t;
 $('notice').classList.add('on');

 setTimeout(()=>{
  $('notice').classList.remove('on');
 },1250);
}

function scoreShot(){
 if(mode!=='flight')return;

 mode='wait';

 const x=body.position.x;
 const z=body.position.z+distance;
 const r=Math.hypot(x,z);

 const inside=
  r<.031&&body.position.y<.045;

 const cm=inside?0:Math.round(r*100);
 records.push(cm);

 notice(inside?'IN!':cm+' cm');

 $('scoreline').textContent=
  records.map(n=>`${n}cm`).join('  /  ');

 setTimeout(()=>{
  round++;
  if(round===3)end();
  else resetShot();
 },1700);
}

function end(){
 mode='end';

 $('resultNumber').textContent=
  records.reduce((a,b)=>a+b,0)+' cm';

 $('results').innerHTML=
  records.map((v,i)=>
   `BEAN ${i+1}　${v} cm`
  ).join('<br>');

 $('intro').classList.add('hidden');
 $('end').classList.remove('hidden');
 $('screen').classList.remove('hidden');
}

$('start').onclick=start;
$('again').onclick=start;

$('home').onclick=()=>{
 location.href='../../';
};

$('share').onclick=()=>{
 const total=records.reduce((a,b)=>a+b,0);

 const txt=
  `🫛 枝豆飛ばし｜IDLE-LAB\n`+
  `${records.join('cm / ')}cm\n`+
  `合計 ${total}cm\n`+
  `#IDLELAB #枝豆飛ばし`;

 window.open(
  'https://twitter.com/intent/tweet?'+
  new URLSearchParams({
   text:txt,
   url:location.href
  }),
  '_blank',
  'noopener,noreferrer'
 );
};

// スマホ操作
const canvas=renderer.domElement;

canvas.addEventListener('pointerdown',e=>{
 if(mode!=='aim')return;

 canvas.setPointerCapture(e.pointerId);

 pointers.set(e.pointerId,{
  x:e.clientX,
  y:e.clientY
 });

 if(pointers.size===2){
  const p=[...pointers.values()];

  pinch={
   initial:Math.hypot(
    p[0].x-p[1].x,
    p[0].y-p[1].y
   ),
   travel:0,
   started:performance.now()
  };

  charge=0;
 }
});

canvas.addEventListener('pointermove',e=>{
 if(mode!=='aim'||!pointers.has(e.pointerId))return;

 const old=pointers.get(e.pointerId);

 pointers.set(e.pointerId,{
  x:e.clientX,
  y:e.clientY
 });

 if(pointers.size===1){
  // 左右・上下とも1本指ドラッグ
  yaw=Math.max(
   -38,
   Math.min(38,yaw+(e.clientX-old.x)*.14)
  );

  pitch=Math.max(
   8,
   Math.min(73,pitch+(old.y-e.clientY)*.13)
  );

  updatePod();

 }else if(pointers.size===2&&pinch){
  const p=[...pointers.values()];

  const d=Math.hypot(
   p[0].x-p[1].x,
   p[0].y-p[1].y
  );

  pinch.travel=Math.max(
   pinch.travel,
   pinch.initial-d
  );

  charge=Math.max(
   0,
   Math.min(1,pinch.travel/105)
  );

  updatePod();

  if(charge>.35&&(d<55||charge>.92)){
   const elapsed=Math.max(
    .07,
    (performance.now()-pinch.started)/1000
   );

   launch(Math.min(
    1,
    charge*.55+(charge/elapsed)*.2
   ));
  }
 }
});

function release(e){
 pointers.delete(e.pointerId);

 if(mode==='aim'&&pinch&&pointers.size<2){
  if(charge>.16){
   const elapsed=Math.max(
    .07,
    (performance.now()-pinch.started)/1000
   );

   launch(Math.min(
    1,
    charge*.6+(charge/elapsed)*.16
   ));
  }

  pinch=null;
  charge=0;
  updatePod();
 }
}

canvas.addEventListener('pointerup',release);
canvas.addEventListener('pointercancel',release);

// PC操作
let keyStart=0;

window.addEventListener('keydown',e=>{
 if(mode!=='aim')return;

 if([
  'ArrowLeft','ArrowRight',
  'ArrowUp','ArrowDown','Space'
 ].includes(e.code)){
  e.preventDefault();
 }

 if(e.code==='ArrowLeft')yaw=Math.max(-38,yaw-2);
 if(e.code==='ArrowRight')yaw=Math.min(38,yaw+2);
 if(e.code==='ArrowUp')pitch=Math.min(73,pitch+2);
 if(e.code==='ArrowDown')pitch=Math.max(8,pitch-2);

 if(e.code==='Space'&&!keyStart){
  keyStart=performance.now();
 }

 updatePod();
});

window.addEventListener('keyup',e=>{
 if(e.code==='Space'&&keyStart){
  const elapsed=performance.now()-keyStart;
  keyStart=0;

  launch(Math.min(
   1,
   Math.max(.1,elapsed/1250)
  ));
 }
});

// 描画と物理演算
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);

 if(mode==='flight'&&body){
  world.step(1/120,dt,5);

  bean.position.copy(body.position);
  bean.quaternion.copy(body.quaternion);

  const p=body.position;

  const follow=new THREE.Vector3(
   p.x*.9,
   p.y+.22,
   p.z+.57
  );

  camera.position.lerp(
   follow,
   Math.min(1,dt*3.8)
  );

  camera.lookAt(
   p.x,
   p.y,
   p.z-.18
  );

  const elapsed=
   (performance.now()-shotStart)/1000;

  if(body.velocity.length()<.07&&p.y<.09){
   still+=dt;
  }else{
   still=0;
  }

  if(still>1.05||elapsed>16){
   scoreShot();
  }

 }else if(mode==='aim'){
  camera.position.lerp(
   new THREE.Vector3(0,.42,1.12),
   Math.min(1,dt*4)
  );

  camera.lookAt(0,.14,-1.1);
 }

 renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

updatePod();
$('load').remove();
animate();
</script>
</body>
</html>
