
<!doctype html>

<style>

<body>
<div id="app"></div>
<div id="ui">
<header>
<div>

</div>

<div id="screen">
<div class="panel" id="intro">
<div class="eyebrow">GAME 001</div>
<h1>🫛 枝豆飛ばし</h1>
<p>3粒の枝豆を、小さなお茶碗へ。<br>止まった場所が近いほど好記録。</p>
<div class="howto">
<div><b>1本指でドラッグ</b>　上下左右に狙う</div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.180.0';
import * as CANNON from 'https://esm.sh/cannon-es@0.20.0';

const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x3a322c);
scene.fog=new THREE.Fog(0x3a322c,5,16);

const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.01,30);
const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:'high-performance'
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
$('app').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffe8cc,0x5c5549,2));

const sun=new THREE.DirectionalLight(0xffe2ae,2.8);
sun.position.set(-1.5,4,2);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-2;
sun.shadow.camera.right=2;
sun.shadow.camera.top=2;
sun.shadow.camera.bottom=-2;
scene.add(sun);

const material=(color,roughness=.75,opts={})=>
 new THREE.MeshStandardMaterial({color,roughness,...opts});

const wood=material(0x8b6448,.91);
const darkWood=material(0x543e30);
const podGreen=material(0x79aa48);
const podLight=material(0x94c75c);
const podDark=material(0x41692f);
const seamMat=material(0x24471c,.9);
const beanGreen=material(0xa7c76c,.58);
const ceramicOuter=material(0xe9e3d6,.37,{
 side:THREE.DoubleSide
});
const ceramicInner=material(0xc9d8d3,.4,{
 side:THREE.DoubleSide
});

// 木製床
const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(30,30),
 wood
);
floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
scene.add(floor);

for(let i=-16;i<=16;i++){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(.004,.001,12),
  darkWood
 );
 m.position.set(i*.17,.001,-2);
 scene.add(m);
}

for(let i=0;i<75;i++){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(.001,.001,.04+Math.random()*.3),
  material(0xb9906c,.9,{
   transparent:true,
   opacity:.16
  })
 );
 m.position.set(
  (Math.random()-.5)*4,
  .002,
  -Math.random()*5
 );
 scene.add(m);
}

const wall=new THREE.Mesh(
 new THREE.PlaneGeometry(15,8),
 material(0x70645b,.95)
);
wall.position.set(0,4,-4.8);
scene.add(wall);

// 物理エンジン
const world=new CANNON.World({
 gravity:new CANNON.Vec3(0,-9.82,0)
});
world.allowSleep=true;
world.solver.iterations=14;
world.broadphase=new CANNON.SAPBroadphase(world);

const floorMaterial=new CANNON.Material('wood');
const beanMaterial=new CANNON.Material('bean');
const bowlMaterial=new CANNON.Material('bowl');

world.addContactMaterial(
 new CANNON.ContactMaterial(
  floorMaterial,
  beanMaterial,
  {friction:.9,restitution:.12}
 )
);
world.addContactMaterial(
 new CANNON.ContactMaterial(
  bowlMaterial,
  beanMaterial,
  {friction:.7,restitution:.15}
 )
);

const floorBody=new CANNON.Body({
 mass:0,
 material:floorMaterial,
 shape:new CANNON.Plane()
});
floorBody.quaternion.setFromEuler(-Math.PI/2,0,0);
world.addBody(floorBody);

// お茶碗：直径5cm、高さ約2.7cm
const BOWL_R=.025;
const BOWL_H=.027;
const BEAN_R=.008;

let targetDistance=.75;
let bowlGroup=null;
let bowlBodies=[];

function bowlRadius(y){
 const t=Math.max(
  0,
  Math.min(1,y/BOWL_H)
 );
 return .011+.014*Math.pow(t,.86);
}

function createBowl(){
 if(bowlGroup)scene.remove(bowlGroup);

 for(const b of bowlBodies){
  world.removeBody(b);
 }
 bowlBodies=[];

 bowlGroup=new THREE.Group();
 bowlGroup.position.z=-targetDistance;
 scene.add(bowlGroup);

 const profile=[];
 for(let i=0;i<=24;i++){
  const y=BOWL_H*i/24;
  profile.push(
   new THREE.Vector2(bowlRadius(y),y)
  );
 }

 const shell=new THREE.Mesh(
  new THREE.LatheGeometry(profile,48),
  ceramicOuter
 );
 shell.castShadow=true;
 shell.receiveShadow=true;
 bowlGroup.add(shell);

 const inside=[];
 for(let i=0;i<=24;i++){
  const y=.004+(BOWL_H-.004)*i/24;
  inside.push(
   new THREE.Vector2(
    Math.max(.004,bowlRadius(y)-.003),
    y
   )
  );
 }

 const liner=new THREE.Mesh(
  new THREE.LatheGeometry(inside,48),
  ceramicInner
 );
 liner.receiveShadow=true;
 bowlGroup.add(liner);

 const rim=new THREE.Mesh(
  new THREE.TorusGeometry(.024,.0015,8,48),
  ceramicOuter
 );
 rim.rotation.x=Math.PI/2;
 rim.position.y=BOWL_H;
 bowlGroup.add(rim);

 const base=new THREE.Mesh(
  new THREE.CylinderGeometry(.012,.013,.003,32),
  ceramicOuter
 );
 base.position.y=.0015;
 bowlGroup.add(base);

 // お茶碗の壁の衝突判定
 for(let k=0;k<5;k++){
  const y0=BOWL_H*k/5;
  const y1=BOWL_H*(k+1)/5;
  const rm=(bowlRadius(y0)+bowlRadius(y1))/2;

  for(let j=0;j<40;j++){
   const a=(j+.5)*Math.PI*2/40;
   const halfTangential=
    rm*Math.sin(Math.PI/40)+.0007;

   const b=new CANNON.Body({
    mass:0,
    material:bowlMaterial
   });

   b.addShape(
    new CANNON.Box(
     new CANNON.Vec3(
      .0018,
      (y1-y0)/2+.0004,
      halfTangential
     )
    )
   );

   b.position.set(
    rm*Math.cos(a),
    (y0+y1)/2,
    -targetDistance+rm*Math.sin(a)
   );
   b.quaternion.setFromEuler(0,-a,0);

   world.addBody(b);
   bowlBodies.push(b);
  }
 }

 const bottom=new CANNON.Body({
  mass:0,
  material:bowlMaterial
 });
 bottom.addShape(
  new CANNON.Cylinder(.012,.012,.004,24)
 );
 bottom.position.set(0,.003,-targetDistance);
 world.addBody(bottom);
 bowlBodies.push(bottom);
}

// 枝豆のさや
const pod=new THREE.Group();
scene.add(pod);

const podModel=new THREE.Group();
pod.add(podModel);

function podGeometry(){
 const rings=64;
 const sides=32;
 const v=[];
 const idx=[];

 for(let i=0;i<=rings;i++){
  const t=i/rings;
  const x=(t-.5)*.18;
  const tip=Math.pow(
   Math.max(.005,Math.sin(Math.PI*t)),
   .68
  );

  let swell=0;
  for(const c of [.24,.5,.76]){
   swell+=.0075*Math.exp(
    -Math.pow((t-c)/.092,2)
   );
  }

  const r=(.008+swell)*tip;

  for(let j=0;j<=sides;j++){
   const a=j/sides*Math.PI*2;
   v.push(
    x,
    Math.sin(a)*r*1.2,
    Math.cos(a)*r*.78
   );

   if(i<rings&&j<sides){
    const n=i*(sides+1)+j;
    idx.push(
     n,n+sides+1,n+1,
     n+1,n+sides+1,n+sides+2
    );
   }
  }
 }

 const g=new THREE.BufferGeometry();
 g.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(v,3)
 );
 g.setIndex(idx);
 g.computeVertexNormals();
 return g;
}

const shell=new THREE.Mesh(
 podGeometry(),
 podGreen
);
shell.castShadow=true;
podModel.add(shell);

const bumps=[];
for(let i=0;i<3;i++){
 const b=new THREE.Mesh(
  new THREE.SphereGeometry(.017,28,18),
  podLight
 );
 b.scale.set(1,.84,.5);
 b.position.set((i-1)*.045,0,-.006);
 b.castShadow=true;
 podModel.add(b);
 bumps.push(b);
}

// 裏側の合わせ目を強調
for(const offset of [-.0035,0,.0035]){
 const points=[];

 for(let i=0;i<=70;i++){
  const t=.025+.95*i/70;
  const x=(t-.5)*.18;
  const end=Math.pow(
   Math.max(.005,Math.sin(Math.PI*t)),
   .68
  );
  const z=-(
   .008+.005*Math.sin(3*Math.PI*t)**2
  )*end*.79;

  points.push(
   new THREE.Vector3(
    x,
    offset,
    z-.003
   )
  );
 }

 const curve=new THREE.CatmullRomCurve3(points);
 const line=new THREE.Mesh(
  new THREE.TubeGeometry(
   curve,
   90,
   offset===0?.0032:.0012,
   6,
   false
  ),
  offset===0?seamMat:podLight
 );
 podModel.add(line);
}

// 射出方向マーク
const direction=new THREE.Group();
pod.add(direction);

const shaft=new THREE.Mesh(
 new THREE.CylinderGeometry(.0012,.0012,.065,8),
 podDark
);
shaft.rotation.x=Math.PI/2;
shaft.position.z=-.05;
direction.add(shaft);

const tip=new THREE.Mesh(
 new THREE.ConeGeometry(.004,.012,10),
 podDark
);
tip.rotation.x=-Math.PI/2;
tip.position.z=-.09;
direction.add(tip);

const stem=new THREE.Mesh(
 new THREE.CylinderGeometry(.002,.003,.018,8),
 podDark
);
stem.rotation.z=Math.PI/2;
stem.position.x=-.095;
podModel.add(stem);

// ゲーム状態
let yaw=0;
let pitch=32;
let round=0;
let records=[];
let mode='menu';
let bean=null;
let body=null;
let shotAt=0;
let still=0;
let charge=0;
let pinch=null;

const pointers=new Map();

function updatePod(){
 pod.position.set(0,.13,.19);
 pod.rotation.order='YXZ';
 pod.rotation.y=yaw*Math.PI/180;
 pod.rotation.x=-pitch*Math.PI/180;

 bumps.forEach((b,i)=>{
  b.visible=i>=round;
 });

 shell.scale.y=1-charge*.23;
 shell.scale.z=1-charge*.25;

 bumps.forEach(b=>{
  b.scale.z=.5*(1-charge*.5);
 });

 direction.visible=mode==='aim';
}

function resetShot(){
 if(bean){
  scene.remove(bean);
  bean=null;
 }
 if(body){
  world.removeBody(body);
  body=null;
 }

 mode='aim';
 charge=0;
 pinch=null;
 still=0;
 pointers.clear();

 pod.visible=true;
 updatePod();

 $('beans').textContent=
  '● '.repeat(3-round)+
  '○ '.repeat(round);

 $('bottom').textContent=
  records.length
  ?records.map(n=>n+' cm').join('  /  ')
  :'';

 camera.position.set(0,.34,.68);
 camera.lookAt(0,.13,-.36);
}

function start(){
 targetDistance=
  (50+Math.floor(Math.random()*51))/100;

 round=0;
 records=[];
 yaw=0;
 pitch=32;

 createBowl();

 $('distance').textContent=
  Math.round(targetDistance*100)+' cm';

 $('screen').classList.add('hidden');
 resetShot();
}

function launch(strength){
 if(mode!=='aim')return;

 mode='flight';
 pod.visible=false;

 const speed=
  1.25+
  Math.max(.08,Math.min(1,strength))*2.1;

 bean=new THREE.Mesh(
  new THREE.SphereGeometry(BEAN_R,24,16),
  beanGreen
 );
 bean.scale.set(1.1,.9,.95);
 bean.castShadow=true;
 scene.add(bean);

 body=new CANNON.Body({
  mass:.0012,
  material:beanMaterial,
  shape:new CANNON.Sphere(BEAN_R),
  linearDamping:.82,
  angularDamping:.995,
  allowSleep:true,
  sleepSpeedLimit:.06,
  sleepTimeLimit:.5
 });

 body.position.set(0,.13,.10);

 const y=yaw*Math.PI/180;
 const p=pitch*Math.PI/180;

 body.velocity.set(
  Math.sin(y)*Math.cos(p)*speed,
  Math.sin(p)*speed,
  -Math.cos(y)*Math.cos(p)*speed
 );

 body.angularVelocity.set(1.5,2,1);
 world.addBody(body);

 shotAt=performance.now();
 still=0;
}

function toast(text){
 $('notice').textContent=text;
 $('notice').classList.add('show');

 setTimeout(()=>{
  $('notice').classList.remove('show');
 },1250);
}

function finish(){
 if(mode!=='flight'||!body)return;

 mode='wait';

 const x=body.position.x;
 const z=body.position.z+targetDistance;
 const r=Math.hypot(x,z);

 const inside=
  r<.018&&
  body.position.y<BOWL_H+.003;

 const cm=inside?0:Math.round(r*100);
 records.push(cm);

 toast(inside?'IN!':cm+' cm');

 $('bottom').textContent=
  records.map(n=>n+' cm').join('  /  ');

 setTimeout(()=>{
  round++;
  if(round>=3){
   showResults();
  }else{
   resetShot();
  }
 },1600);
}

function showResults(){
 mode='end';

 const sum=records.reduce((a,b)=>a+b,0);
 $('total').textContent=sum+' cm';

 $('details').innerHTML=
  records.map(
   (n,i)=>`BEAN ${i+1}　${n} cm`
  ).join('<br>');

 $('intro').classList.add('hidden');
 $('result').classList.remove('hidden');
 $('screen').classList.remove('hidden');
}

$('start').onclick=start;
$('retry').onclick=start;

$('home').onclick=()=>{
 location.href='../../';
};

$('share').onclick=()=>{
 const sum=records.reduce((a,b)=>a+b,0);

 const text=
  `🫛 枝豆飛ばし｜IDLE-LAB\n`+
  records.map(
   (n,i)=>`${i+1}粒目：${n}cm`
  ).join('\n')+
  `\n合計 ${sum}cm\n`+
  `#IDLELAB #枝豆飛ばし`;

 window.open(
  'https://twitter.com/intent/tweet?'+
  new URLSearchParams({
   text,
   url:location.href
  }),
  '_blank',
  'noopener,noreferrer'
 );
};

// スマホ操作
const canvas=renderer.domElement;

canvas.addEventListener('pointerdown',e=>{
 if(mode!=='aim')return;

 canvas.setPointerCapture(e.pointerId);

 pointers.set(e.pointerId,{
  x:e.clientX,
  y:e.clientY
 });

 if(pointers.size===2){
  const p=[...pointers.values()];

  pinch={
   initial:Math.hypot(
    p[0].x-p[1].x,
    p[0].y-p[1].y
   ),
   travel:0,
   started:performance.now()
  };
  charge=0;
 }
});

canvas.addEventListener('pointermove',e=>{
 if(mode!=='aim'||!pointers.has(e.pointerId))return;

 const old=pointers.get(e.pointerId);

 pointers.set(e.pointerId,{
  x:e.clientX,
  y:e.clientY
 });

 if(pointers.size===1){
  yaw=Math.max(
   -55,
   Math.min(
    55,
    yaw+(e.clientX-old.x)*.22
   )
  );

pitch += (old.y-e.clientY)*.24;

  updatePod();

 }else if(pointers.size===2&&pinch){
  const p=[...pointers.values()];

  const d=Math.hypot(
   p[0].x-p[1].x,
   p[0].y-p[1].y
  );

  pinch.travel=Math.max(
   pinch.travel,
   pinch.initial-d
  );

  charge=Math.max(
   0,
   Math.min(1,pinch.travel/90)
  );

  updatePod();

  if(charge>.36&&(d<55||charge>.94)){
   const elapsed=Math.max(
    .07,
    (performance.now()-pinch.started)/1000
   );

   launch(
    Math.min(
     1,
     charge*.6+(charge/elapsed)*.13
    )
   );
  }
 }
});

function release(e){
 pointers.delete(e.pointerId);

 if(mode==='aim'&&pinch&&pointers.size<2){
  if(charge>.15){
   const elapsed=Math.max(
    .07,
    (performance.now()-pinch.started)/1000
   );

   launch(
    Math.min(
     1,
     charge*.6+(charge/elapsed)*.12
    )
   );
  }

  pinch=null;
  charge=0;
  updatePod();
 }
}

canvas.addEventListener('pointerup',release);
canvas.addEventListener('pointercancel',release);

// PC操作
let keyStart=0;
let pcDragging=false;
let pcX=0;
let pcY=0;

canvas.addEventListener('mousedown',e=>{
 if(mode==='aim'){
  pcDragging=true;
  pcX=e.clientX;
  pcY=e.clientY;
 }
});

window.addEventListener('mousemove',e=>{
 if(!pcDragging||mode!=='aim')return;

 yaw=Math.max(
  -55,
  Math.min(
   55,
   yaw+(e.clientX-pcX)*.22
  )
 );

 pitch=Math.max(
  6,
  Math.min(
   76,
   pitch+(pcY-e.clientY)*.18
  )
 );

 pcX=e.clientX;
 pcY=e.clientY;
 updatePod();
});

window.addEventListener('mouseup',()=>{
 pcDragging=false;
});

window.addEventListener('keydown',e=>{
 if(mode!=='aim')return;

 if(e.code==='Space'){
  e.preventDefault();
  if(!keyStart){
   keyStart=performance.now();
  }
 }
});

window.addEventListener('keyup',e=>{
 if(e.code==='Space'&&keyStart){
  const elapsed=performance.now()-keyStart;
  keyStart=0;

  launch(
   Math.min(
    1,
    Math.max(.08,elapsed/1250)
   )
  );
 }
});

// 物理演算・描画
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);

 if(mode==='flight'&&body){
  world.step(1/120,dt,5);
  // 床に落ちた豆の転がりを抑制
if (body) {
  const onGround = body.position.y <= BEAN_R + .003;

  if (onGround) {
    const damping = Math.pow(0.12, dt * 12);

    body.velocity.x *= damping;
    body.velocity.z *= damping;

    body.angularVelocity.x *= damping;
    body.angularVelocity.y *= damping;
    body.angularVelocity.z *= damping;

    // 十分遅くなったら完全停止
    const horizontalSpeed = Math.hypot(
      body.velocity.x,
      body.velocity.z
    );

    if (horizontalSpeed < .045) {
      body.velocity.x = 0;
      body.velocity.z = 0;
      body.angularVelocity.set(0, 0, 0);
    }
  }
}

  bean.position.copy(body.position);
  bean.quaternion.copy(body.quaternion);

  const p=body.position;

  camera.position.lerp(
   new THREE.Vector3(
    p.x*.8,
    p.y+.16,
    p.z+.34
   ),
   Math.min(1,dt*4)
  );

  camera.lookAt(
   p.x,
   p.y,
   p.z-.09
  );

  const elapsed=
   (performance.now()-shotAt)/1000;

  if(
   body.velocity.length()<.075&&
   p.y<.06
  ){
   still+=dt;
  }else{
   still=0;
  }

  if(still>.65||elapsed>8){
   finish();
  }

 }else if(mode==='aim'){
  camera.position.lerp(
   new THREE.Vector3(0,.34,.68),
   Math.min(1,dt*5)
  );
  camera.lookAt(0,.13,-.36);
 }

 renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

updatePod();
$('loading').remove();
animate();
</script>
</body>
</html>
