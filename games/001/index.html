<script type="module">
import * as THREE from
 'https://esm.sh/three@0.180.0';

import * as CANNON from
 'https://esm.sh/cannon-es@0.20.0';

const $=id=>document.getElementById(id);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const PI=Math.PI;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x3a322c);
scene.fog=new THREE.Fog(0x3a322c,5,16);

const camera=new THREE.PerspectiveCamera(
 52,innerWidth/innerHeight,.005,30
);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:'high-performance'
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
$('app').appendChild(renderer.domElement);

const mat=(color,roughness=.8,extra={})=>
 new THREE.MeshStandardMaterial({
  color,roughness,...extra
 });

const podMat=mat(0x83ad4b,.9,{
 side:THREE.DoubleSide
});
const podDark=mat(0x466b2c);
const seamMat=mat(0x355521);
const beanMat=mat(0xa7c876,.65);
const woodMat=mat(0x896448,.92);
const wallMat=mat(0x70645b,.96);
const ceramic=mat(0xe8e4d9,.42,{
 side:THREE.DoubleSide
});
const ceramicInside=mat(0xc4d7d2,.42,{
 side:THREE.DoubleSide
});

scene.add(new THREE.HemisphereLight(
 0xffe8cb,0x554c43,2.1
));

const sunlight=new THREE.DirectionalLight(
 0xffe4bb,2.7
);
sunlight.position.set(-1.5,4,2);
sunlight.castShadow=true;
sunlight.shadow.mapSize.set(1024,1024);
sunlight.shadow.camera.left=-2;
sunlight.shadow.camera.right=2;
sunlight.shadow.camera.top=2;
sunlight.shadow.camera.bottom=-2;
scene.add(sunlight);

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(30,30),
 woodMat
);
floor.rotation.x=-PI/2;
floor.receiveShadow=true;
scene.add(floor);

const grainMat=mat(0x523e31,.95,{
 transparent:true,opacity:.23
});

for(let i=-80;i<=80;i++){
 const grain=new THREE.Mesh(
  new THREE.BoxGeometry(.001,.001,8),
  grainMat
 );
 grain.position.set(i*.035,.001,-2);
 scene.add(grain);
}

const wall=new THREE.Mesh(
 new THREE.PlaneGeometry(15,8),
 wallMat
);
wall.position.set(0,4,-4.8);
scene.add(wall);

// 物理
const world=new CANNON.World({
 gravity:new CANNON.Vec3(0,-9.82,0)
});
world.allowSleep=true;
world.solver.iterations=15;
world.broadphase=new CANNON.SAPBroadphase(world);

const floorPhys=new CANNON.Material('floor');
const beanPhys=new CANNON.Material('bean');
const bowlPhys=new CANNON.Material('bowl');

world.addContactMaterial(
 new CANNON.ContactMaterial(
  floorPhys,beanPhys,{
   friction:.7,
   restitution:.36
  }
 )
);
world.addContactMaterial(
 new CANNON.ContactMaterial(
  bowlPhys,beanPhys,{
   friction:.5,
   restitution:.24
  }
 )
);

const ground=new CANNON.Body({
 mass:0,
 material:floorPhys,
 shape:new CANNON.Plane()
});
ground.quaternion.setFromEuler(-PI/2,0,0);
world.addBody(ground);

// お茶碗
const BOWL_R=.025;
const BOWL_H=.027;
const BEAN_R=.008;

let targetDistance=.75;
let bowlGroup=null;
let bowlBodies=[];

function bowlRadius(y){
 const t=clamp(y/BOWL_H,0,1);
 return .011+.014*Math.pow(t,.85);
}

function makeBowl(){
 if(bowlGroup)scene.remove(bowlGroup);

 for(const b of bowlBodies){
  world.removeBody(b);
 }
 bowlBodies=[];

 bowlGroup=new THREE.Group();
 bowlGroup.position.z=-targetDistance;
 scene.add(bowlGroup);

 const outer=[];
 const inner=[];

 for(let i=0;i<=32;i++){
  const y=BOWL_H*i/32;
  outer.push(new THREE.Vector2(
   bowlRadius(y),y
  ));

  const yi=.004+(BOWL_H-.004)*i/32;
  inner.push(new THREE.Vector2(
   Math.max(.004,bowlRadius(yi)-.003),
   yi
  ));
 }

 const shell=new THREE.Mesh(
  new THREE.LatheGeometry(outer,48),
  ceramic
 );
 shell.castShadow=true;
 shell.receiveShadow=true;
 bowlGroup.add(shell);

 const lining=new THREE.Mesh(
  new THREE.LatheGeometry(inner,48),
  ceramicInside
 );
 lining.receiveShadow=true;
 bowlGroup.add(lining);

 const rim=new THREE.Mesh(
  new THREE.TorusGeometry(.024,.0015,8,48),
  ceramic
 );
 rim.rotation.x=PI/2;
 rim.position.y=BOWL_H;
 bowlGroup.add(rim);

 const base=new THREE.Mesh(
  new THREE.CylinderGeometry(.012,.013,.003,32),
  ceramic
 );
 base.position.y=.0015;
 bowlGroup.add(base);

 // 内側・外側・縁に衝突判定
 for(let k=0;k<6;k++){
  const y0=BOWL_H*k/6;
  const y1=BOWL_H*(k+1)/6;
  const r=(bowlRadius(y0)+bowlRadius(y1))/2;

  for(let j=0;j<48;j++){
   const a=(j+.5)*2*PI/48;

   const b=new CANNON.Body({
    mass:0,
    material:bowlPhys
   });

   b.addShape(new CANNON.Box(
    new CANNON.Vec3(
     .0017,
     (y1-y0)/2+.0004,
     r*Math.sin(PI/48)+.0007
    )
   ));

   b.position.set(
    r*Math.cos(a),
    (y0+y1)/2,
    -targetDistance+r*Math.sin(a)
   );

   b.quaternion.setFromEuler(0,-a,0);
   world.addBody(b);
   bowlBodies.push(b);
  }
 }

 const bottom=new CANNON.Body({
  mass:0,
  material:bowlPhys
 });
 bottom.addShape(new CANNON.Cylinder(
  .012,.012,.004,24
 ));
 bottom.position.set(0,.003,-targetDistance);
 world.addBody(bottom);
 bowlBodies.push(bottom);
}

// 枝豆のさや
const pod=new THREE.Group();
scene.add(pod);

const podVisual=new THREE.Group();
pod.add(podVisual);

const beanCenters=[-.047,0,.047];

let remaining=3;
let shellLeft=null;
let shellRight=null;
let seam=null;
let openAmount=0;
let openingUntil=0;

// さやの形：豆を外に重ねず、表面自体を膨らませる
function radiusAt(t,count){
 const end=Math.pow(
  Math.max(.001,Math.sin(PI*t)),.7
 );

 let bulge=.008;

 for(let i=0;i<count;i++){
  const c=.24+i*.26;
  bulge+=.009*Math.exp(
   -Math.pow((t-c)/.095,2)
  );
 }

 return bulge*end;
}

function makeHalf(start,end,count){
 const rings=80;
 const sides=24;
 const vertices=[];
 const indices=[];

 for(let i=0;i<=rings;i++){
  const t=i/rings;
  const x=(t-.5)*.19;
  const r=radiusAt(t,count);

  for(let j=0;j<=sides;j++){
   const a=start+(end-start)*j/sides;

   vertices.push(
    x,
    Math.sin(a)*r*1.18,
    Math.cos(a)*r*.84
   );

   if(i<rings&&j<sides){
    const n=i*(sides+1)+j;
    indices.push(
     n,n+1,n+sides+1,
     n+1,n+sides+2,n+sides+1
    );
   }
  }
 }

 const geo=new THREE.BufferGeometry();
 geo.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(
   vertices,3
  )
 );
 geo.setIndex(indices);
 geo.computeVertexNormals();

 const mesh=new THREE.Mesh(geo,podMat);
 mesh.castShadow=true;
 return mesh;
}

function makeSeam(count){
 const points=[];

 for(let i=0;i<=100;i++){
  const t=.015+.97*i/100;
  const x=(t-.5)*.19;
  const r=radiusAt(t,count);

  points.push(new THREE.Vector3(
   x,
   0,
   -r*.84-.0015
  ));
 }

 const curve=new THREE.CatmullRomCurve3(points);

 const mesh=new THREE.Mesh(
  new THREE.TubeGeometry(
   curve,120,.0019,8,false
  ),
  seamMat
 );
 return mesh;
}

function rebuildPod(){
 if(shellLeft){
  podVisual.remove(shellLeft);
  shellLeft.geometry.dispose();
 }
 if(shellRight){
  podVisual.remove(shellRight);
  shellRight.geometry.dispose();
 }
 if(seam){
  podVisual.remove(seam);
  seam.geometry.dispose();
 }

 shellLeft=makeHalf(0,PI,remaining);
 shellRight=makeHalf(PI,2*PI,remaining);
 seam=makeSeam(remaining);

 podVisual.add(shellLeft,shellRight,seam);

 shellLeft.position.y=0;
 shellRight.position.y=0;
 seam.visible=true;
}

const stem=new THREE.Mesh(
 new THREE.CylinderGeometry(
  .0025,.0035,.018,9
 ),
 podDark
);
stem.rotation.z=PI/2;
stem.position.x=-.102;
podVisual.add(stem);

// 小さなさや先端
const tip=new THREE.Mesh(
 new THREE.ConeGeometry(.004,.018,10),
 podDark
);
tip.rotation.z=-PI/2;
tip.position.x=.103;
podVisual.add(tip);

// 状態
let mode='menu';
let round=0;
let records=[];
let yaw=0;
let pitch=28;
let body=null;
let bean=null;
let shotTime=0;
let stillTime=0;
let groundHits=0;
let hasGrounded=false;
let launchCharge=0;
let pinch=null;
let lastShotPosition=null;

const pointers=new Map();
const UP=new THREE.Vector3(0,1,0);
const FORWARD=new THREE.Vector3(0,0,-1);
const launchOrigin=new THREE.Vector3();

function updateAim(){
 pod.position.set(0,.13,.19);

 pod.rotation.order='YXZ';
 pod.rotation.y=yaw*PI/180;
 pod.rotation.x=pitch*PI/180;

 // さやの合わせ目を向けた方向へ飛ぶ
 pod.updateMatrixWorld(true);

 shellLeft.position.y=openAmount;
 shellRight.position.y=-openAmount;

 seam.visible=openAmount<.002;
}

function updateCounter(){
 $('beans').textContent=
  Array(3).fill(0).map(
   (_,i)=>i<round?'○':'●'
  ).join(' ');
}

function clearBean(){
 if(bean){
  scene.remove(bean);
  bean.geometry.dispose();
  bean=null;
 }

 if(body){
  world.removeBody(body);
  body=null;
 }
}

function resetAim(){
 clearBean();

 mode='aim';
 stillTime=0;
 groundHits=0;
 hasGrounded=false;
 launchCharge=0;
 openAmount=0;
 pinch=null;
 pointers.clear();

 remaining=3-round;
 rebuildPod();

 pod.visible=true;
 updateAim();
 updateCounter();

 $('bottom').textContent=
  records.length
  ?records.map(n=>n+' cm').join(' / ')
  :'';

 camera.position.set(0,.34,.68);
 camera.lookAt(0,.13,-.35);
}

function startGame(){
 round=0;
 records=[];
 yaw=0;
 pitch=28;

 targetDistance=
  (50+Math.floor(Math.random()*51))/100;

 $('distance').textContent=
  Math.round(targetDistance*100)+' cm';

 makeBowl();

 $('intro').classList.add('hidden');
 $('result').classList.add('hidden');
 $('screen').classList.add('hidden');

 resetAim();
}

function launch(strength=1){
 if(mode!=='aim')return;

 mode='flight';
 pointers.clear();
 pinch=null;

 // 発射方向と、さやの合わせ目の向きを完全に共通化
 pod.updateMatrixWorld(true);

 const direction=FORWARD.clone()
  .applyQuaternion(pod.quaternion)
  .normalize();

 // さやの合わせ目、最後に残っている豆の位置
 const beanIndex=3-remaining;
 const localX=beanCenters[beanIndex];

 launchOrigin.set(
  localX,0,-.025
 );
 pod.localToWorld(launchOrigin);

 const speed=1.5+clamp(strength,0,1)*1.1;

 bean=new THREE.Mesh(
  new THREE.SphereGeometry(BEAN_R,20,14),
  beanMat
 );
 bean.scale.set(1.12,.9,.96);
 bean.castShadow=true;
 bean.position.copy(launchOrigin);
 scene.add(bean);

 body=new CANNON.Body({
  mass:.0012,
  material:beanPhys,
  shape:new CANNON.Sphere(BEAN_R),
  linearDamping:.07,
  angularDamping:.65,
  allowSleep:true,
  sleepSpeedLimit:.055,
  sleepTimeLimit:.55
 });

 body.position.set(
  launchOrigin.x,
  launchOrigin.y,
  launchOrigin.z
 );

 body.velocity.set(
  direction.x*speed,
  direction.y*speed,
  direction.z*speed
 );

 body.angularVelocity.set(1,2,.6);

 body.addEventListener('collide',event=>{
  if(event.body===ground){
   groundHits++;
   hasGrounded=true;
  }
 });

 world.addBody(body);

 // さやが開くアニメーション
 openAmount=.008;
 openingUntil=performance.now()+220;
 updateAim();

 shotTime=performance.now();
 stillTime=0;
}

function toast(message){
 $('notice').textContent=message;
 $('notice').classList.add('show');

 setTimeout(()=>{
  $('notice').classList.remove('show');
 },1200);
}

function finishShot(){
 if(mode!=='flight'||!body)return;

 mode='wait';

 const x=body.position.x;
 const z=body.position.z+targetDistance;
 const radius=Math.hypot(x,z);

 const inBowl=
  radius<.017&&
  body.position.y<BOWL_H+.004;

 const cm=inBowl
  ?0
  :Math.round(radius*100);

 records.push(cm);
 toast(inBowl?'IN!':cm+' cm');

 $('bottom').textContent=
  records.map(n=>n+' cm').join(' / ');

 setTimeout(()=>{
  round++;

  if(round===3){
   showResult();
  }else{
   resetAim();
  }
 },1300);
}

 
let resultBlob = null;
let resultImageURL = null;

async function createResultImage() {
  const canvas = document.createElement('canvas');
  canvas.width = 1200;
  canvas.height = 630;

  const ctx = canvas.getContext('2d');

  // 背景
  ctx.fillStyle = '#171b15';
  ctx.fillRect(0, 0, 1200, 630);

  // 装飾
  ctx.fillStyle = '#25301e';
  ctx.beginPath();
  ctx.arc(1050, 100, 260, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#303e27';
  ctx.beginPath();
  ctx.arc(1120, 550, 190, 0, Math.PI * 2);
  ctx.fill();

  // ブランド
  ctx.fillStyle = '#c6f36b';
  ctx.font = 'bold 26px Arial';
  ctx.fillText('IDLE-LAB / GAME 001', 65, 70);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 66px sans-serif';
  ctx.fillText('枝豆飛ばし', 65, 155);

  ctx.fillStyle = '#aab5a1';
  ctx.font = '24px sans-serif';
  ctx.fillText('3粒の合計距離', 65, 220);

  // 合計
  const sum = records.reduce((a, b) => a + b, 0);

  ctx.fillStyle = '#c6f36b';
  ctx.font = 'bold 150px Arial';
  ctx.fillText(String(sum), 65, 385);

  const numberWidth = ctx.measureText(String(sum)).width;

  ctx.font = 'bold 48px Arial';
  ctx.fillText('cm', 85 + numberWidth, 385);

  // 各粒の結果
  const labels = ['1粒目', '2粒目', '3粒目'];

  records.forEach((score, i) => {
    const x = 65 + i * 355;

    ctx.fillStyle = '#303a2b';
    ctx.beginPath();
    ctx.roundRect(x, 430, 325, 105, 15);
    ctx.fill();

    ctx.fillStyle = '#b4c3a8';
    ctx.font = '22px sans-serif';
    ctx.fillText(labels[i], x + 24, 465);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 40px Arial';
    ctx.fillText(score + ' cm', x + 24, 510);
  });

  // フッター
  ctx.fillStyle = '#c6f36b';
  ctx.font = 'bold 24px Arial';
  ctx.fillText('IDLE-LAB.', 65, 593);

  ctx.fillStyle = '#aab5a1';
  ctx.font = '20px Arial';
  ctx.fillText(
    '17raff.github.io/IDLE-LAB/',
    790,
    593
  );

  // PNGに変換
  const blob = await new Promise(resolve => {
    canvas.toBlob(resolve, 'image/png');
  });

  if (!blob) {
    throw new Error('画像を生成できませんでした');
  }

  resultBlob = blob;

  if (resultImageURL) {
    URL.revokeObjectURL(resultImageURL);
  }

  resultImageURL = URL.createObjectURL(blob);

  document.getElementById('resultImage').src =
    resultImageURL;
}


function showResult(){
 mode='end';

 const sum=records.reduce((a,b)=>a+b,0);
 $('total').textContent=sum+' cm';

 $('details').replaceChildren();

 records.forEach((n,i)=>{
  const line=document.createElement('div');
  line.textContent=
   `BEAN ${i+1}　${n} cm`;
  $('details').appendChild(line);
 });

 $('result').classList.remove('hidden');
 $('screen').classList.remove('hidden');
 createResultImage().catch(error => {
  console.error(error);
  $('resultImage').alt = '結果画像を生成できませんでした';
});
}

$('start').onclick=startGame;
$('retry').onclick=startGame;

const gameURL =
  'https://17raff.github.io/IDLE-LAB/games/001/';

$('share').onclick = async () => {

    if (!resultBlob) {
      await createResultImage();
    }

    const file = new File(
      [resultBlob],
      'idle-lab-edamame-result.png',

    );

    const sum = records.reduce((a, b) => a + b, 0);

    const shareData = {
      files: [file],
      title: '枝豆飛ばし | IDLE-LAB',
      text:
        `🫛 枝豆飛ばし\n` +
        `合計 ${sum}cm！\n` +
        `#IDLELAB #枝豆飛ばし\n` +
        gameURL
    };

    if (
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({ files: [file] })
    ) {
      await navigator.share(shareData);
    } else {
      alert(
        'この環境では画像を直接共有できません。' +
        '画像を保存してXに添付してください。'
      );
    }
  } catch (error) {
    if (error.name !== 'AbortError') {
      console.error(error);
      alert(
        '共有できませんでした。' +
        '「画像を保存」をお試しください。'
      );
    }
  }
};

$('saveImage').onclick = async () => {
  try {
    if (!resultBlob) {
      await createResultImage();
    }

    const url = URL.createObjectURL(resultBlob);
    const a = document.createElement('a');

    a.href = url;
    a.download = 'idle-lab-edamame-result.png';

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (error) {
    console.error(error);
    alert('画像を保存できませんでした');
  }
};


// タッチ操作
const canvas=renderer.domElement;

canvas.addEventListener('pointerdown',e=>{
 if(mode!=='aim')return;

 canvas.setPointerCapture(e.pointerId);

 pointers.set(e.pointerId,{
  x:e.clientX,
  y:e.clientY
 });

 if(pointers.size===2){
  const p=[...pointers.values()];

  pinch={
   initial:Math.hypot(
    p[0].x-p[1].x,
    p[0].y-p[1].y
   ),
   amount:0
  };
 }
});

canvas.addEventListener('pointermove',e=>{
 if(mode!=='aim'||!pointers.has(e.pointerId)){
  return;
 }

 const old=pointers.get(e.pointerId);

 pointers.set(e.pointerId,{
  x:e.clientX,
  y:e.clientY
 });

 if(pointers.size===1){
  yaw+=(e.clientX-old.x)*.23;

  // 上下は角度制限なし
  pitch+=(old.y-e.clientY)*.24;

  updateAim();
 }

 if(pointers.size===2&&pinch){
  const p=[...pointers.values()];

  const d=Math.hypot(
   p[0].x-p[1].x,
   p[0].y-p[1].y
  );

  pinch.amount=Math.max(
   pinch.amount,
   pinch.initial-d
  );

  launchCharge=clamp(
   pinch.amount/85,0,1
  );

  openAmount=launchCharge*.003;
  updateAim();

  if(launchCharge>.65){
   launch(launchCharge);
  }
 }
});

function releasePointer(e){
 pointers.delete(e.pointerId);

 if(mode==='aim'&&pinch&&pointers.size<2){
  if(launchCharge>.22){
   launch(launchCharge);
  }else{
   openAmount=0;
   updateAim();
  }

  pinch=null;
  launchCharge=0;
 }
}

canvas.addEventListener(
 'pointerup',releasePointer
);
canvas.addEventListener(
 'pointercancel',releasePointer
);

// PC操作
let spaceStart=0;
const keys=new Set();

window.addEventListener('keydown',e=>{
 if(mode!=='aim')return;

 if([
  'ArrowUp','ArrowDown',
  'ArrowLeft','ArrowRight','Space'
 ].includes(e.code)){
  e.preventDefault();
 }

 keys.add(e.code);

 if(e.code==='Space'&&!spaceStart){
  spaceStart=performance.now();
 }
});

window.addEventListener('keyup',e=>{
 keys.delete(e.code);

 if(e.code==='Space'&&spaceStart){
  const held=performance.now()-spaceStart;
  spaceStart=0;

  launch(clamp(held/650,.25,1));
 }
});

// PCのマウスドラッグはpointermoveと共通
// 矢印キーでも照準を動かせる

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.035);

 if(mode==='aim'){
  const turn=80*dt;

  if(keys.has('ArrowLeft'))yaw-=turn;
  if(keys.has('ArrowRight'))yaw+=turn;
  if(keys.has('ArrowUp'))pitch+=turn;
  if(keys.has('ArrowDown'))pitch-=turn;

  updateAim();

  camera.position.lerp(
   new THREE.Vector3(0,.34,.68),
   Math.min(1,dt*5)
  );
  camera.lookAt(0,.13,-.35);
 }

 if(mode==='flight'&&body){
  world.step(1/120,dt,6);

  const p=body.position;

  // 跳ねる間は速度を残し、
  // 着地後の転がりだけを抑える
  const onFloor=
   p.y<=BEAN_R+.0025;

  const verticalSpeed=
   Math.abs(body.velocity.y);

  if(hasGrounded&&onFloor){
   // 横方向の滑り・転がりを減速
   const factor=Math.exp(-5*dt);

   body.velocity.x*=factor;
   body.velocity.z*=factor;

   body.angularVelocity.x*=Math.exp(-9*dt);
   body.angularVelocity.y*=Math.exp(-9*dt);
   body.angularVelocity.z*=Math.exp(-9*dt);

   // 跳ねが弱くなった後だけ強く止める
   if(verticalSpeed<.35){
    const slow=Math.exp(-13*dt);
    body.velocity.x*=slow;
    body.velocity.z*=slow;
   }

   const horizontal=Math.hypot(
    body.velocity.x,
    body.velocity.z
   );

   if(horizontal<.025&&verticalSpeed<.12){
    body.velocity.x=0;
    body.velocity.z=0;
    body.angularVelocity.set(0,0,0);
   }
  }

  bean.position.copy(body.position);
  bean.quaternion.copy(body.quaternion);

  camera.position.lerp(
   new THREE.Vector3(
    p.x*.65,
    Math.max(.17,p.y+.16),
    p.z+.34
   ),
   Math.min(1,dt*4)
  );

  camera.lookAt(
   p.x,
   Math.max(.015,p.y),
   p.z-.08
  );

  // 開いたさやは残る。
  // 開閉後、飛んだ部分の膨らみを減らす
  if(openingUntil&&
     performance.now()>openingUntil){
   openingUntil=0;
   openAmount=0;

   remaining=Math.max(0,remaining-1);
   rebuildPod();
   updateAim();
  }

  const speed=body.velocity.length();
  const elapsed=
   (performance.now()-shotTime)/1000;

  if(speed<.075&&p.y<.05){
   stillTime+=dt;
  }else{
   stillTime=0;
  }

  if(stillTime>.65||elapsed>8){
   finishShot();
  }
 }

 renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

rebuildPod();
updateAim();
$('loading').remove();
animate();
</script>
</body>
