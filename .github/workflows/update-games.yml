
name: Update game list

on:
  push:
    branches:
      - main
    paths:
      - "games/**"
      - ".github/workflows/update-games.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-games:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate game list
        run: |
          python3 - <<'PY'
          import json
          import re
          import html
          from pathlib import Path

          games = []

          for folder in sorted(Path("games").iterdir(), reverse=True):
              if not folder.is_dir():
                  continue

              if not folder.name.isdigit():
                  continue

              index = folder / "index.html"

              if not index.exists():
                  continue

              source = index.read_text(
                  encoding="utf-8"
              )

              title_match = re.search(
                  r"<title[^>]*>(.*?)</title>",
                  source,
                  re.I | re.S
              )

              title = (
                  html.unescape(title_match.group(1)).strip()
                  if title_match
                  else f"GAME {folder.name}"
              )

              title = re.split(
                  r"\s*[|｜]\s*IDLE-LAB",
                  title,
                  flags=re.I
              )[0].strip()

              desc_match = re.search(
                  r'<meta\s+name=["\']description["\']\s+content=["\']([^"\']*)',
                  source,
                  re.I
              )

              description = (
                  html.unescape(desc_match.group(1))
                  if desc_match
                  else "ちょっとした暇に、ちょっとしたゲーム。"
              )

              games.append({
                  "id": folder.name,
                  "title": title,
                  "description": description,
                  "url": f"./games/{folder.name}/"
              })

          Path("games.json").write_text(
              json.dumps(
                  games,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(f"Registered {len(games)} games")
          PY

      - name: Commit updated game list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Automatically update game list"
          git push
